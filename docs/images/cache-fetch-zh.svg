<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-labelledby="t d">
<title id="t">模型要看之前某张图时</title>
<desc id="d">两次请求。取图的那一轮，IMG-001 的原图加在当前这一轮的末尾，第 1 轮里它的占位符保持原样，所以之前各轮全部从缓存读取。下一轮，取回的副本换成一句说明，只有那一轮里它后面的内容重新处理。</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', Helvetica, Arial, sans-serif; }
  .bg { fill: #fcfcfb; } .edge { fill: none; stroke: #dddcd6; }
  .t1 { fill: #0b0b0b; } .t2 { fill: #52514e; }
  .hit { fill: #2a78d6; } .again { fill: #eb6834; } .new { fill: #e3e2dc; }
  .hatch { fill: #fcfcfb; fill-opacity: 0.38; }
  .ghost { fill: none; stroke: #9c9b93; stroke-width: 1.2; stroke-dasharray: 4 3; }
  .paper { fill: #fcfcfb; } .ink { fill: #0b0b0b; }
  .pill { fill: none; stroke: #fcfcfb; stroke-width: 1.8; stroke-dasharray: 3.2 2.2; }
  .note { fill: #fcfcfb; }
  .arrow { fill: none; stroke: #52514e; stroke-width: 1.4; } .arrowhead { fill: #52514e; }
  .focus { fill: none; stroke: #2a78d6; stroke-width: 1.5; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19; } .edge { stroke: #3a3a37; }
    .t1 { fill: #f0efec; } .t2 { fill: #c3c2b7; }
    .hit { fill: #3987e5; } .again { fill: #d95926; } .new { fill: #3d3d3a; }
    .hatch { fill: #1a1a19; fill-opacity: 0.34; }
    .ghost { stroke: #8a8980; }
    .paper { fill: #f0efec; } .ink { fill: #1a1a19; }
    .pill { stroke: #f0efec; } .note { fill: #f0efec; }
    .arrow { stroke: #c3c2b7; } .arrowhead { fill: #c3c2b7; }
    .focus { stroke: #3987e5; }
  }
</style>
<defs><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect class="hatch" width="2.6" height="7"/></pattern></defs>
<rect class="bg" x="0.5" y="0.5" width="879" height="399" rx="10"/><rect class="edge" x="0.5" y="0.5" width="879" height="399" rx="10"/>
<text class="t1" x="24" y="36" font-size="17" font-weight="600">模型要看之前某张图时</text><rect class="hit" x="24" y="52.5" width="30" height="18" rx="4"/><text class="t2" x="60" y="66" font-size="12.5" >从缓存读取</text><rect class="again" x="144.5" y="52.5" width="30" height="18" rx="4"/><rect fill="url(#hatch)" x="144.5" y="52.5" width="30" height="18" rx="4"/><text class="t2" x="180.5" y="66" font-size="12.5" >重新处理</text><rect class="new" x="252.5" y="52.5" width="30" height="18" rx="4"/><text class="t2" x="288.5" y="66" font-size="12.5" >这一轮新增</text><rect class="hit" x="373" y="52.5" width="30" height="18" rx="4"/><rect class="pill" x="377" y="56.5" width="22" height="10" rx="5"/><text class="t2" x="409" y="66" font-size="12.5" >占位符</text><rect class="hit" x="468.5" y="52.5" width="30" height="18" rx="4"/><rect class="note" x="472.5" y="60" width="22" height="3" rx="1.5"/><text class="t2" x="504.5" y="66" font-size="12.5" >一句说明</text><text class="t1" x="24" y="104" font-size="14.5" font-weight="600">这一轮：模型取回 IMG-001</text><rect class="hit" x="24" y="174" width="138" height="32" rx="4"/><rect class="pill" x="58" y="185" width="22" height="10" rx="5"/><text class="t2" x="93" y="222" font-size="12" text-anchor="middle">第 1 轮</text><rect class="hit" x="164" y="174" width="138" height="32" rx="4"/><rect class="pill" x="198" y="185" width="22" height="10" rx="5"/><text class="t2" x="233" y="222" font-size="12" text-anchor="middle">第 2 轮</text><rect class="hit" x="304" y="174" width="138" height="32" rx="4"/><rect class="pill" x="338" y="185" width="22" height="10" rx="5"/><text class="t2" x="373" y="222" font-size="12" text-anchor="middle">第 3 轮</text><rect class="hit" x="444" y="174" width="138" height="32" rx="4"/><rect class="pill" x="478" y="185" width="22" height="10" rx="5"/><text class="t2" x="513" y="222" font-size="12" text-anchor="middle">第 4 轮</text><rect class="new" x="584" y="174" width="138" height="32" rx="4"/><rect class="paper" x="662" y="182" width="16" height="16" rx="2.5"/><path class="ink" d="M664.5 194.5L668.8 188.5L671.6 192L673 190.6L675.5 194.5Z"/><circle class="ink" cx="673.4" cy="186.6" r="1.5"/><text class="t2" x="653" y="222" font-size="12" text-anchor="middle">这一轮</text><text class="t2" x="69" y="166" font-size="12" text-anchor="middle">IMG-001</text><text class="t2" x="670" y="166" font-size="12" text-anchor="middle">IMG-001</text><path class="arrow" d="M99 161 C 229 130, 500 130, 634 160"/><path class="arrowhead" d="M640 162 l-9.6 -0.6 l3.6 -7 z"/><text class="t2" x="369.5" y="130" font-size="12.5" text-anchor="middle">原图加在末尾，占位符留在原处不动</text><text class="t2" x="24" y="250" font-size="13" >当前这一轮之前的内容一个字都不变，全部从缓存读取，模型取哪张都一样。</text><text class="t1" x="24" y="290" font-size="14.5" font-weight="600">下一轮</text><rect class="hit" x="24" y="302" width="138" height="32" rx="4"/><rect class="pill" x="58" y="313" width="22" height="10" rx="5"/><text class="t2" x="93" y="350" font-size="12" text-anchor="middle">第 1 轮</text><rect class="hit" x="164" y="302" width="138" height="32" rx="4"/><rect class="pill" x="198" y="313" width="22" height="10" rx="5"/><text class="t2" x="233" y="350" font-size="12" text-anchor="middle">第 2 轮</text><rect class="hit" x="304" y="302" width="138" height="32" rx="4"/><rect class="pill" x="338" y="313" width="22" height="10" rx="5"/><text class="t2" x="373" y="350" font-size="12" text-anchor="middle">第 3 轮</text><rect class="hit" x="444" y="302" width="138" height="32" rx="4"/><rect class="pill" x="478" y="313" width="22" height="10" rx="5"/><text class="t2" x="513" y="350" font-size="12" text-anchor="middle">第 4 轮</text><rect class="hit" x="584" y="302" width="74" height="32" rx="4"/><rect class="again" x="660" y="302" width="62" height="32" rx="4"/><rect fill="url(#hatch)" x="660" y="302" width="62" height="32" rx="4"/><rect class="note" x="666" y="316.5" width="22" height="3" rx="1.5"/><text class="t2" x="653" y="350" font-size="12" text-anchor="middle">上一轮</text><rect class="new" x="724" y="302" width="132" height="32" rx="4"/><text class="t2" x="790" y="350" font-size="12" text-anchor="middle">新消息</text><text class="t2" x="24" y="378" font-size="13" >取回的副本换成一句说明，只有那一轮里它后面的内容重新处理一次。</text>
</svg>
