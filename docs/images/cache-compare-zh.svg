<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 516" width="880" height="516" role="img" aria-labelledby="t d">
<title id="t">下一次请求里，哪些内容要重新处理</title>
<desc id="d">处理多图长对话的四种做法，各画成从第 1 轮到新消息的下一次请求。全部照发时整段走缓存，但每张图都要重发。压缩图片和丢掉早期历史都改动了对话的开头，后面几乎全部重新处理。本插件只把上一轮的图换成占位符，只有上一轮剩下的部分重新处理。</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', Helvetica, Arial, sans-serif; }
  .bg { fill: #fcfcfb; } .edge { fill: none; stroke: #dddcd6; }
  .t1 { fill: #0b0b0b; } .t2 { fill: #52514e; }
  .hit { fill: #2a78d6; } .again { fill: #eb6834; } .new { fill: #e3e2dc; }
  .hatch { fill: #fcfcfb; fill-opacity: 0.38; }
  .ghost { fill: none; stroke: #9c9b93; stroke-width: 1.2; stroke-dasharray: 4 3; }
  .paper { fill: #fcfcfb; } .ink { fill: #0b0b0b; }
  .pill { fill: none; stroke: #fcfcfb; stroke-width: 1.8; stroke-dasharray: 3.2 2.2; }
  .note { fill: #fcfcfb; }
  .arrow { fill: none; stroke: #52514e; stroke-width: 1.4; } .arrowhead { fill: #52514e; }
  .focus { fill: none; stroke: #2a78d6; stroke-width: 1.5; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19; } .edge { stroke: #3a3a37; }
    .t1 { fill: #f0efec; } .t2 { fill: #c3c2b7; }
    .hit { fill: #3987e5; } .again { fill: #d95926; } .new { fill: #3d3d3a; }
    .hatch { fill: #1a1a19; fill-opacity: 0.34; }
    .ghost { stroke: #8a8980; }
    .paper { fill: #f0efec; } .ink { fill: #1a1a19; }
    .pill { stroke: #f0efec; } .note { fill: #f0efec; }
    .arrow { stroke: #c3c2b7; } .arrowhead { fill: #c3c2b7; }
    .focus { stroke: #3987e5; }
  }
</style>
<defs><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect class="hatch" width="2.6" height="7"/></pattern></defs>
<rect class="bg" x="0.5" y="0.5" width="879" height="515" rx="10"/><rect class="edge" x="0.5" y="0.5" width="879" height="515" rx="10"/>
<text class="t1" x="24" y="36" font-size="17" font-weight="600">下一次请求里，哪些内容要重新处理</text><rect class="hit" x="24" y="52.5" width="30" height="18" rx="4"/><text class="t2" x="60" y="66" font-size="12.5" >从缓存读取</text><rect class="again" x="144.5" y="52.5" width="30" height="18" rx="4"/><rect fill="url(#hatch)" x="144.5" y="52.5" width="30" height="18" rx="4"/><text class="t2" x="180.5" y="66" font-size="12.5" >重新处理</text><rect class="new" x="252.5" y="52.5" width="30" height="18" rx="4"/><text class="t2" x="288.5" y="66" font-size="12.5" >这一轮新增</text><rect class="hit" x="373" y="52.5" width="30" height="18" rx="4"/><rect class="paper" x="381" y="54.5" width="14" height="14" rx="2.19"/><path class="ink" d="M383.19 65.44L386.95 60.19L389.4 63.25L390.63 62.02L392.81 65.44Z"/><circle class="ink" cx="390.98" cy="58.52" r="1.31"/><text class="t2" x="409" y="66" font-size="12.5" >原图</text><rect class="hit" x="456" y="52.5" width="30" height="18" rx="4"/><rect class="pill" x="460" y="56.5" width="22" height="10" rx="5"/><text class="t2" x="492" y="66" font-size="12.5" >占位符</text><text class="t1" x="24" y="104" font-size="14.5" font-weight="600">全部照发（不装插件）</text><text class="t2" x="93" y="127" font-size="12" text-anchor="middle">第 1 轮</text><text class="t2" x="233" y="127" font-size="12" text-anchor="middle">第 2 轮</text><text class="t2" x="373" y="127" font-size="12" text-anchor="middle">第 3 轮</text><text class="t2" x="513" y="127" font-size="12" text-anchor="middle">第 4 轮</text><text class="t2" x="653" y="127" font-size="12" text-anchor="middle">上一轮</text><text class="t2" x="790" y="127" font-size="12" text-anchor="middle">新消息</text><rect class="hit" x="24" y="134" width="138" height="32" rx="4"/><rect class="paper" x="58" y="142" width="16" height="16" rx="2.5"/><path class="ink" d="M60.5 154.5L64.8 148.5L67.6 152L69 150.6L71.5 154.5Z"/><circle class="ink" cx="69.4" cy="146.6" r="1.5"/><rect class="hit" x="164" y="134" width="138" height="32" rx="4"/><rect class="paper" x="198" y="142" width="16" height="16" rx="2.5"/><path class="ink" d="M200.5 154.5L204.8 148.5L207.6 152L209 150.6L211.5 154.5Z"/><circle class="ink" cx="209.4" cy="146.6" r="1.5"/><rect class="hit" x="304" y="134" width="138" height="32" rx="4"/><rect class="paper" x="338" y="142" width="16" height="16" rx="2.5"/><path class="ink" d="M340.5 154.5L344.8 148.5L347.6 152L349 150.6L351.5 154.5Z"/><circle class="ink" cx="349.4" cy="146.6" r="1.5"/><rect class="hit" x="444" y="134" width="138" height="32" rx="4"/><rect class="paper" x="478" y="142" width="16" height="16" rx="2.5"/><path class="ink" d="M480.5 154.5L484.8 148.5L487.6 152L489 150.6L491.5 154.5Z"/><circle class="ink" cx="489.4" cy="146.6" r="1.5"/><rect class="hit" x="584" y="134" width="138" height="32" rx="4"/><rect class="paper" x="618" y="142" width="16" height="16" rx="2.5"/><path class="ink" d="M620.5 154.5L624.8 148.5L627.6 152L629 150.6L631.5 154.5Z"/><circle class="ink" cx="629.4" cy="146.6" r="1.5"/><rect class="new" x="724" y="134" width="132" height="32" rx="4"/><text class="t2" x="24" y="186" font-size="13" >缓存接得上，但每张图每条消息都要重发一遍，直到对话发不出去。</text><text class="t1" x="24" y="226" font-size="14.5" font-weight="600">压缩图片</text><rect class="hit" x="24" y="238" width="30" height="32" rx="4"/><rect class="again" x="56" y="238" width="106" height="32" rx="4"/><rect fill="url(#hatch)" x="56" y="238" width="106" height="32" rx="4"/><rect class="paper" x="62" y="249" width="10" height="10" rx="1.56"/><path class="ink" d="M63.56 256.81L66.25 253.06L68 255.25L68.88 254.38L70.44 256.81Z"/><circle class="ink" cx="69.13" cy="251.88" r="0.94"/><rect class="again" x="164" y="238" width="138" height="32" rx="4"/><rect fill="url(#hatch)" x="164" y="238" width="138" height="32" rx="4"/><rect class="paper" x="202" y="249" width="10" height="10" rx="1.56"/><path class="ink" d="M203.56 256.81L206.25 253.06L208 255.25L208.88 254.38L210.44 256.81Z"/><circle class="ink" cx="209.13" cy="251.88" r="0.94"/><rect class="again" x="304" y="238" width="138" height="32" rx="4"/><rect fill="url(#hatch)" x="304" y="238" width="138" height="32" rx="4"/><rect class="paper" x="342" y="249" width="10" height="10" rx="1.56"/><path class="ink" d="M343.56 256.81L346.25 253.06L348 255.25L348.88 254.38L350.44 256.81Z"/><circle class="ink" cx="349.13" cy="251.88" r="0.94"/><rect class="again" x="444" y="238" width="138" height="32" rx="4"/><rect fill="url(#hatch)" x="444" y="238" width="138" height="32" rx="4"/><rect class="paper" x="482" y="249" width="10" height="10" rx="1.56"/><path class="ink" d="M483.56 256.81L486.25 253.06L488 255.25L488.88 254.38L490.44 256.81Z"/><circle class="ink" cx="489.13" cy="251.88" r="0.94"/><rect class="again" x="584" y="238" width="138" height="32" rx="4"/><rect fill="url(#hatch)" x="584" y="238" width="138" height="32" rx="4"/><rect class="paper" x="622" y="249" width="10" height="10" rx="1.56"/><path class="ink" d="M623.56 256.81L626.25 253.06L628 255.25L628.88 254.38L630.44 256.81Z"/><circle class="ink" cx="629.13" cy="251.88" r="0.94"/><rect class="new" x="724" y="238" width="132" height="32" rx="4"/><text class="t2" x="24" y="290" font-size="13" >每张图都换成一张新的、画质更差的图，从第一张图起全部重新处理。</text><text class="t1" x="24" y="330" font-size="14.5" font-weight="600">丢掉早期历史，或换成摘要</text><rect class="ghost" x="24.6" y="342.6" width="416.8" height="30.8" rx="4"/><text class="t2" x="233" y="362.5" font-size="12.5" text-anchor="middle">被拿掉或换成摘要</text><rect class="again" x="444" y="342" width="138" height="32" rx="4"/><rect fill="url(#hatch)" x="444" y="342" width="138" height="32" rx="4"/><rect class="paper" x="478" y="350" width="16" height="16" rx="2.5"/><path class="ink" d="M480.5 362.5L484.8 356.5L487.6 360L489 358.6L491.5 362.5Z"/><circle class="ink" cx="489.4" cy="354.6" r="1.5"/><rect class="again" x="584" y="342" width="138" height="32" rx="4"/><rect fill="url(#hatch)" x="584" y="342" width="138" height="32" rx="4"/><rect class="paper" x="618" y="350" width="16" height="16" rx="2.5"/><path class="ink" d="M620.5 362.5L624.8 356.5L627.6 360L629 358.6L631.5 362.5Z"/><circle class="ink" cx="629.4" cy="354.6" r="1.5"/><rect class="new" x="724" y="342" width="132" height="32" rx="4"/><text class="t2" x="24" y="394" font-size="13" >对话的开头变了，后面的全部重新处理；被拿掉的内容，模型再也看不到。</text><rect class="focus" x="12" y="412" width="856" height="98" rx="8"/><text class="t1" x="24" y="434" font-size="14.5" font-weight="600">本插件：把上一轮的图换成占位符</text><rect class="hit" x="24" y="446" width="138" height="32" rx="4"/><rect class="pill" x="58" y="457" width="22" height="10" rx="5"/><rect class="hit" x="164" y="446" width="138" height="32" rx="4"/><rect class="pill" x="198" y="457" width="22" height="10" rx="5"/><rect class="hit" x="304" y="446" width="138" height="32" rx="4"/><rect class="pill" x="338" y="457" width="22" height="10" rx="5"/><rect class="hit" x="444" y="446" width="138" height="32" rx="4"/><rect class="pill" x="478" y="457" width="22" height="10" rx="5"/><rect class="hit" x="584" y="446" width="30" height="32" rx="4"/><rect class="again" x="616" y="446" width="106" height="32" rx="4"/><rect fill="url(#hatch)" x="616" y="446" width="106" height="32" rx="4"/><rect class="again" x="620" y="453" width="30" height="18" rx="4"/><rect class="pill" x="624" y="457" width="22" height="10" rx="5"/><rect class="new" x="724" y="446" width="132" height="32" rx="4"/><text class="t2" x="24" y="498" font-size="13" >之前的内容照常走缓存，只有上一轮剩下的部分重新处理一次。</text>
</svg>
