name: 技术问题报告 / Bug report (technical)
description: 给熟悉命令行的人：附上版本、安装状态和日志 / For developers, with versions, install status and logs
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        谢谢反馈。这个模板要填版本、安装状态和日志；不熟悉命令行的话，用「用着有问题」那个模板就行。
        Thanks! This one asks for versions, install status and logs. Not into the command line? Use "Something's not right" instead.

        **Codex 连不上时 / If Codex cannot connect:** 先运行卸载命令恢复直连（见 INSTALL.md 的 Uninstall），再来提问题。
        Run the uninstall command from INSTALL.md first to restore the direct connection.
        **Claude 连不上时 / If Claude Code cannot connect:** 卸载 Claude 插件后，新会话会直接连接。
        Uninstall the Claude plugin; new sessions then connect directly.
  - type: dropdown
    id: app
    attributes:
      label: 应用 / App
      options: [Codex, Claude Desktop]
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 平台 / Platform
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: input
    id: codex
    attributes:
      label: 应用版本 / App version
      description: Codex 桌面版的版本号或 `codex --version` 的输出；Claude 桌面版的版本号或 `claude --version` 的输出 / The desktop app's version, or the output of `codex --version` or `claude --version`
    validations:
      required: true
  - type: input
    id: plugin
    attributes:
      label: 插件版本 / Plugin version
      placeholder: "0.8.2"
  - type: textarea
    id: what
    attributes:
      label: 发生了什么 / What happened
      description: 做了什么，期望什么，实际看到什么 / What you did, what you expected, what you saw
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: 安装状态 / Install status
      description: |
        Codex：`cam status` 的输出（不含凭据）；Claude：`claude plugin list` 的输出。
        Codex: the output of `cam status` (it contains no credentials). Claude: the output of `claude plugin list`.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: 日志 / Logs
      description: |
        数据目录里 `plugin-server.jsonl` 和 `proxy/<日期>.jsonl` 的最后几十行。日志只记元数据，不含对话内容；贴之前请再看一眼。
        The last lines of `plugin-server.jsonl` and `proxy/<date>.jsonl` in the data folder. They hold metadata only; please check before pasting.
      render: text
